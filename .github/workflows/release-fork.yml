name: Release (fork)

# fork 专用发布流程：不依赖 Apple 签名/公证 secrets，macOS 产出未签名 DMG。
# 触发方式：推送 v* tag（如 v0.2.81 / v0.2.81.1），或在 Actions 页面手动运行并填写版本号。
# 版本号只能是 v + 数字和点：rpm 的 Version 字段不允许连字符。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v0.2.81 或 v0.2.81.1），将作为 tag 与文件名里的版本"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-fork-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  INNOSETUP_VERSION: 6.7.1
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_X86_64_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi
          if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "版本号 '$version' 不合法：必须形如 v0.2.81 或 v0.2.81.1（rpm 不允许连字符）" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows-setup:
    name: Build Windows x64 Setup
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Inno Setup
        run: choco install innosetup --version="$env:INNOSETUP_VERSION" --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: .\scripts\build-setup.ps1 -Version "${env:VERSION}" -Arch x64 -Target x86_64-pc-windows-msvc

      - name: Upload Setup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termy-setup-x64
          path: target/dist/Termy-${{ env.VERSION }}-windows-x64-Setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: x86_64
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            libvulkan1 \
            rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build Linux tarball
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET"

      - name: Install appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          echo "${APPIMAGETOOL_X86_64_SHA256}  /tmp/appimagetool.AppImage" | sha256sum -c -
          chmod +x /tmp/appimagetool.AppImage
          echo "APPIMAGETOOL=/tmp/appimagetool.AppImage" >> "$GITHUB_ENV"

      - name: Build Linux AppImage
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET" --format appimage

      - name: Build Linux deb
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET" --format deb

      - name: Build Linux rpm
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET" --format rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termy-linux-${{ env.ARCH }}
          path: |
            target/dist/Termy-${{ env.VERSION }}-linux-${{ env.ARCH }}.tar.gz
            target/dist/Termy-${{ env.VERSION }}-linux-${{ env.ARCH }}.AppImage
            target/dist/Termy-${{ env.VERSION }}-linux-${{ env.ARCH }}.deb
            target/dist/Termy-${{ env.VERSION }}-linux-${{ env.ARCH }}.rpm
          if-no-files-found: error

  build-dmg:
    name: Build ${{ matrix.arch }} DMG (unsigned)
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-26
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      # 不传签名身份，build-dmg.sh 会产出未签名的 DMG；首次打开需在系统设置里手动放行。
      - name: Build unsigned DMG
        run: ./scripts/build-dmg.sh --version "$VERSION" --arch "${{ matrix.arch }}" --target "${{ matrix.target }}" --no-layout

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termy-dmg-${{ matrix.arch }}
          path: dist/Termy-${{ env.VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - meta
      - build-windows-setup
      - build-linux
      - build-dmg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Termy ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
